<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابزارهای رنگ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e, #0d0d2b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f7971e, #ffd200, #00ffc8, #4d96ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .sub {
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px 25px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: block;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card .icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 12px;
        }

        .card .title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card .desc {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .card.contrast { border-top: 3px solid #4d96ff; }
        .card.palette { border-top: 3px solid #ff6b6b; }

        .footer {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.05);
            font-size: 0.7rem;
        }

        @media (max-width: 500px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 ابزارهای رنگ</h1>
        <p class="sub">دو تا ابزار کاربردی برای کار با رنگ‌ها</p>

        <div class="grid">
            <a href="contrast.html" class="card contrast">
                <span class="icon">📐</span>
                <div class="title">تضاد رنگ</div>
                <div class="desc">محاسبه کنتراست بین متن و پس‌زمینه</div>
            </a>

            <a href="palette.html" class="card palette">
                <span class="icon">🌈</span>
                <div class="title">پالت عددی</div>
                <div class="desc">دریافت رنگ با وارد کردن عدد ۱ تا ۲۰</div>
            </a>
        </div>

        <div class="footer">برای استفاده روی هرکدوم کلیک کن</div>
    </div>

</body>
</html>
